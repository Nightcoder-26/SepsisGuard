name: SepsisGuard v3.0 Automated Quality & Security Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Pytest Suite
      env:
        FLASK_SECRET_KEY: "ci_test_secret_key_8f9a2b4c6d8e1f3a5c7b9d2e4f6a8c0b"
        API_KEY: "sepsisguard_api_key_3f7b9a1c5d8e2f4a6c0b8d1e3f5a7c9b"
        FRONTEND_ORIGIN: "http://localhost:5000"
        PREDICT_RATE_LIMIT: "60 per minute"
      run: |
        pytest -v
